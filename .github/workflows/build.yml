name: APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk "CapsuleIsland-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CapsuleIsland-${{ github.run_number }}
          path: CapsuleIsland-*.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Capsule Island ${{ github.run_number }}
          body: |
            Automatisch gebaut aus `${{ github.sha }}`.
            Auf dem Handy die APK unten herunterladen und installieren (über die alte Version).
          files: CapsuleIsland-*.apk
          make_latest: true
